<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180" role="img" aria-label="Nyan cat rainbow banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f0c29" stop-opacity="0"/>
      <stop offset="1" stop-color="#302b63" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rainbow trail -->
  <g stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="20"  y1="70"  x2="470" y2="58"  stroke="#ff5e57"/>
    <line x1="20"  y1="88"  x2="470" y2="76"  stroke="#ffa94d"/>
    <line x1="20"  y1="106" x2="470" y2="94"  stroke="#ffd43b"/>
    <line x1="20"  y1="124" x2="470" y2="112" stroke="#69db7c"/>
    <line x1="20"  y1="142" x2="470" y2="130" stroke="#4dabf7"/>
  </g>

  <!-- simplified cat body -->
  <g>
    <ellipse cx="560" cy="105" rx="78" ry="40" fill="#e9ecef"/>
    <ellipse cx="560" cy="118" rx="60" ry="22" fill="#dee2e6"/>
    <!-- head -->
    <circle cx="620" cy="90" r="34" fill="#f1f3f5"/>
    <!-- ears -->
    <polygon points="598,64 604,40 616,62" fill="#f1f3f5"/>
    <polygon points="628,62 640,40 646,66" fill="#f1f3f5"/>
    <!-- eyes -->
    <circle cx="612" cy="88" r="4" fill="#212529"/>
    <circle cx="632" cy="88" r="4" fill="#212529"/>
    <!-- nose / mouth -->
    <polygon points="620,96 616,101 624,101" fill="#ff8787"/>
    <path d="M620 101 q-4 5 -9 3 M620 101 q4 5 9 3" stroke="#868e96" stroke-width="1.6" fill="none"/>
    <!-- paws -->
    <ellipse cx="520" cy="138" rx="12" ry="7" fill="#dee2e6"/>
    <ellipse cx="556" cy="140" rx="12" ry="7" fill="#dee2e6"/>
    <ellipse cx="592" cy="138" rx="12" ry="7" fill="#dee2e6"/>
    <!-- tail -->
    <path d="M486 100 q-26 -6 -34 -28" stroke="#adb5bd" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- stars -->
  <g fill="#ffe066">
    <circle cx="120" cy="40" r="2.5"/>
    <circle cx="260" cy="30" r="2"/>
    <circle cx="380" cy="150" r="2.5"/>
    <circle cx="80"  cy="150" r="2"/>
  </g>
</svg>
